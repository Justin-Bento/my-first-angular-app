<main class="min-h-dvh mx-auto max-w-3xl px-4 sm:px-6 lg:px-8">
  <article class="my-16">
    @if (loading()) {
    <p class="text-gray-600">Loading post…</p>
    } @else if (error()) {
    <p class="text-red-700" role="alert">{{ error() }}</p>
    } @else if (post(); as p) {
    <h1 class="text-3xl font-semibold tracking-tight text-yellow-950 md:text-4xl">{{ p.title }}</h1>
    <p class="mt-6 text-base text-gray-600">{{ p.body }}</p>
    } @else {
    <p class="text-gray-600">Post not found.</p>
    }
  </article>
</main>
